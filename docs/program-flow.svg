<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 820 700" font-family="Helvetica, Arial, sans-serif">
<title>Program flow diagram</title>

<rect x="0" y="0" width="820" height="700" fill="#FFFFFF"/>

<defs>
<marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
<path d="M0,0 L7,3.2 L0,6.4 z" fill="#5F5E5A"/>
</marker>
</defs>

<text x="410" y="38" text-anchor="middle" font-size="19" font-weight="600" fill="#1A1A18">Program Flow</text>

<rect x="290" y="66" width="240" height="52" rx="26" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
<text x="410" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Reset / power-on</text>

<line x1="410" y1="118" x2="410" y2="146" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="250" y="150" width="320" height="76" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="410" y="174" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2C2C2A">Initialise</text>
<text x="410" y="193" text-anchor="middle" font-size="11.5" fill="#5F5E5A">Enable GPIOB + GPIOC clocks · PB0,1,2,10 output</text>
<text x="410" y="211" text-anchor="middle" font-size="11.5" fill="#5F5E5A">PB5 input + pull-up · PC13 input · all LEDs off</text>

<line x1="410" y1="226" x2="410" y2="254" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="300" y="258" width="220" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/>
<text x="410" y="285" text-anchor="middle" font-size="12.5" fill="#2C2C2A">free_counter++</text>

<line x1="410" y1="302" x2="410" y2="330" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<polygon points="410,334 570,384 410,434 250,384" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="410" y="379" text-anchor="middle" font-size="12" font-weight="600" fill="#14415F">Blue button pressed?</text>
<text x="410" y="396" text-anchor="middle" font-size="11" fill="#2C6DA8">IDR bit 13 == 0</text>

<text x="585" y="380" font-size="11.5" font-weight="600" fill="#2C6DA8">yes</text>
<line x1="570" y1="384" x2="640" y2="384" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="640" y1="384" x2="640" y2="452" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="600" y="456" width="200" height="86" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
<text x="700" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#0A4D3C">Show random number</text>
<text x="700" y="498" text-anchor="middle" font-size="11" fill="#0F6E56">xorshift32 → 0-15</text>
<text x="700" y="515" text-anchor="middle" font-size="11" fill="#0F6E56">map bits → ODR</text>
<text x="700" y="532" text-anchor="middle" font-size="11" fill="#0F6E56">wait for release</text>

<text x="222" y="380" font-size="11.5" font-weight="600" fill="#2C6DA8">no</text>
<line x1="250" y1="384" x2="180" y2="384" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="180" y1="384" x2="180" y2="440" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<polygon points="180,444 330,492 180,540 30,492" fill="#E4F0FB" stroke="#2C6DA8" stroke-width="1.2"/>
<text x="180" y="487" text-anchor="middle" font-size="12" font-weight="600" fill="#14415F">Red button pressed?</text>
<text x="180" y="504" text-anchor="middle" font-size="11" fill="#2C6DA8">IDR bit 5 == 0</text>

<text x="346" y="488" font-size="11.5" font-weight="600" fill="#2C6DA8">yes</text>
<line x1="330" y1="492" x2="390" y2="492" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="390" y1="492" x2="390" y2="560" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="300" y="564" width="180" height="64" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.2"/>
<text x="390" y="588" text-anchor="middle" font-size="12" font-weight="600" fill="#633806">Clear all LEDs</text>
<text x="390" y="606" text-anchor="middle" font-size="11" fill="#854F0B">ODR &amp;= ~LED_MASK</text>
<text x="390" y="622" text-anchor="middle" font-size="11" fill="#854F0B">wait for release</text>

<text x="60" y="560" font-size="11.5" font-weight="600" fill="#2C6DA8">no</text>
<line x1="30" y1="492" x2="20" y2="492" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="20" y1="492" x2="20" y2="280" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="20" y1="280" x2="300" y2="280" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="34" y="392" font-size="11" fill="#8A8880">loop</text>

<line x1="700" y1="542" x2="700" y2="660" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="700" y1="660" x2="20" y2="660" stroke="#5F5E5A" stroke-width="1.6"/>
<line x1="390" y1="628" x2="390" y2="660" stroke="#5F5E5A" stroke-width="1.6"/>

<text x="410" y="682" text-anchor="middle" font-size="11" fill="#8A8880">all paths return to the top of the loop</text>
</svg>
