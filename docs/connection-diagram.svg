<line x1="50" y1="654" x2="910" y2="654" stroke="#D3D1C7" stroke-width="1"/>

<text x="50" y="680" font-size="12" font-weight="700" fill="#1A1A18">Each LED branch:</text>
<text x="176" y="680" font-size="12" fill="#444441">pin → resistor → LED long leg · LED short leg (bar side) → blue rail</text>
<text x="50" y="702" font-size="12" font-weight="700" fill="#B54708">PB3 and PB4 avoided:</text>
<text x="204" y="702" font-size="12" fill="#444441">they carry SWO and NJTRST debug functions and are unreliable as plain GPIOs.</text>
