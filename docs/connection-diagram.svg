<text x="100" y="584" font-size="12" font-weight="600" fill="#185FA5">Breadboard blue (−) rail</text>
<text x="262" y="584" font-size="12" fill="#4B7FBB">— bridge the two halves with a jumper; most 830-point boards split it in the middle.</text>

<line x1="495" y1="556" x2="495" y2="600" stroke="#5F5E5A" stroke-width="1.8"/>
<line x1="470" y1="600" x2="520" y2="600" stroke="#5F5E5A" stroke-width="3"/>
